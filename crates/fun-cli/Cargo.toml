[package]
name = "fun-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first Rust function runtime CLI"
include = [
    "src/main.rs",
    "src/templates/rust-http/Cargo.toml.template",
    "src/templates/rust-http/src/main.rs",
    "src/templates/nodejs/index.js",
    "src/templates/python3/main.py",
    "src/templates/python3/test_main.py",
    "src/templates/go1x/go.mod",
    "src/templates/go1x/main.go",
    "src/templates/provided/bootstrap",
    "tests/end_to_end.rs",
]

[[bin]]
name = "fun"
path = "src/main.rs"

[dependencies]
clap.workspace = true
fun-core.workspace = true
fun-server = { path = "../fun-server" }
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
libc = "0.2"
